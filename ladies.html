<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ladies Wear — Cozy Designs</title>
<meta name="description" content="Ladies wear collection by Cozy Designs — everyday sets, festive outfits, and custom designs, made by hand in Kottayam, Kerala." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#000000;
  --navy-2:#1a1a1a;
  --gold:#E6B33A;
  --gold-soft:#F0C763;
  --ivory:#FBF8F1;
  --ivory-2:#FFFFFF;
  --ink:#15213F;
  --muted:#6E7488;
  --muted-d:#AEB6CC;
  --line:#E7E2D6;
  --line-d:rgba(230,179,58,.22);
  --max:1180px;
  --gap:clamp(1.25rem,4vw,2.5rem);
  --font-display:"Fraunces", Georgia, serif;
  --font-body:"Mulish", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-script:"Dancing Script", cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gap)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.05}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}

/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-d)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem 1rem;min-height:66px;padding:.7rem 0}
.wordmark{display:inline-flex;align-items:center;gap:.6rem}
.wordmark .name{font-family:var(--font-display);font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-size:1.8rem;line-height:1}
.back{font-size:.8rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-d);transition:color .2s ease}
@media(max-width:480px){.back{font-size:.7rem}.nav-inner{gap:.4rem .7rem}}
.back:hover{color:var(--gold)}
.logo-img{height:80px;width:auto;display:block}

/* header */
.page-head{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:var(--ivory);text-align:center;padding:clamp(3rem,7vw,5rem) 0}
.page-head .script{font-family:var(--font-script);font-weight:700;color:var(--gold);font-size:clamp(1.6rem,4vw,2.4rem);display:block;margin-bottom:.3rem}
.page-head h1{color:var(--ivory);font-size:clamp(2.4rem,6vw,3.8rem);margin-bottom:1rem}
.page-head p{color:var(--muted-d);max-width:46ch;margin:0 auto}

/* category nav chips */
.cat-jump{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.6rem}
.cat-jump a{font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line-d);border-radius:999px;padding:.5rem 1rem;transition:all .2s ease}
.cat-jump a:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* gallery */
.section{padding:clamp(3rem,6vw,5rem) 0}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.9rem,1.8vw,1.3rem)}
.tile{position:relative;display:flex;flex-direction:column}
.tile-img{aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--ivory-2);border:1px solid var(--line);cursor:pointer}
.tile-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.tile:hover .tile-img img{transform:scale(1.05)}
.tile .cap{margin-top:.6rem;font-size:.9rem;font-weight:600}
.tile .code{margin-top:.15rem;font-size:.74rem;letter-spacing:.03em;color:var(--muted)}
.tile .desc{margin-top:.25rem;font-size:.82rem;color:var(--muted);line-height:1.45}
.tile .price{margin-top:.35rem;font-size:.94rem;font-weight:700;color:var(--ink)}
.order-btn{display:inline-flex;align-items:center;gap:.35rem;margin-top:.6rem;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);background:var(--gold);padding:.5rem .9rem;border-radius:999px;transition:background .2s ease;align-self:flex-start}
.order-btn:hover{background:var(--gold-soft)}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem}
.ph .ph-cap{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cat{margin-bottom:clamp(2.5rem,5vw,3.6rem);scroll-margin-top:90px}
.cat-head{margin-bottom:1.3rem}
.cat-head h2{font-size:clamp(1.5rem,3.5vw,2.1rem);margin-top:.35rem}
.empty-note{color:var(--muted);font-size:.92rem;border:1px dashed var(--line);border-radius:10px;padding:1.4rem;text-align:center}

/* "more photos" badge on tiles that have several images */
.more-badge{position:absolute;top:.6rem;right:.6rem;display:inline-flex;align-items:center;gap:.3rem;
  background:rgba(0,0,0,.62);color:var(--gold);font-size:.7rem;font-weight:700;letter-spacing:.04em;
  padding:.28rem .55rem;border-radius:999px;backdrop-filter:blur(3px)}

/* bottom CTA */
.foot-cta{text-align:center;margin-top:clamp(2.5rem,5vw,3.5rem)}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.6rem;font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink);transition:all .2s ease;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--ivory)}

/* footer */
.footer{background:var(--navy);padding:2.4rem 0;font-size:.8rem;color:var(--muted-d)}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}

/* ============================================================
   LIGHTBOX  (click a photo → view all photos for that product)
   ============================================================ */
.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.9);backdrop-filter:blur(4px);padding:clamp(1rem,4vw,3rem)}
.lightbox.open{display:flex}
.lb-stage{position:relative;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:.7rem}
.lb-frame{width:100%;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#0d0d0d;border:1px solid var(--line-d)}
.lb-frame img{width:100%;height:100%;object-fit:contain;background:#0d0d0d}
.lb-title{font-family:var(--font-display);color:var(--ivory);font-size:1.15rem;text-align:center}
.lb-desc{color:var(--muted-d);font-size:.88rem;text-align:center;max-width:44ch}
.lb-price{color:var(--gold);font-weight:700;font-size:1rem}
.lb-order{display:inline-flex;align-items:center;gap:.4rem;font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);background:var(--gold);padding:.55rem 1.1rem;border-radius:999px;transition:background .2s ease}
.lb-order:hover{background:var(--gold-soft)}
.lb-counter{font-size:.78rem;letter-spacing:.1em;color:var(--muted-d)}

.lb-close{position:fixed;top:clamp(.9rem,3vw,1.5rem);right:clamp(.9rem,3vw,1.5rem);transform:none;z-index:120;
  width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold);background:rgba(0,0,0,.6);
  color:var(--gold);font-size:1.5rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.lb-close:hover{background:var(--gold);color:var(--navy)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  border:1.5px solid var(--gold);background:rgba(0,0,0,.45);color:var(--gold);font-size:1.4rem;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease;z-index:2}
.lb-nav:hover{background:var(--gold);color:var(--navy)}
.lb-prev{left:-.4rem}
.lb-next{right:-.4rem}
.lb-nav[disabled]{opacity:0;pointer-events:none}

.lb-dots{display:flex;gap:.5rem;justify-content:center}
.lb-dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(230,179,58,.35);cursor:pointer;transition:background .2s ease}
.lb-dot.active{background:var(--gold)}

@media(max-width:520px){
  .lb-nav{width:40px;height:40px}
  .lb-prev{left:.2rem}
  .lb-next{right:.2rem}
  .lb-close{transform:translate(0,-115%);right:0}
}

@media(max-width:900px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.gallery-grid{grid-template-columns:1fr}}

@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto}
  .tile:hover .tile-img img{transform:none}
}
</style>
</head>
<body>

<!-- NAV -->
<header class="nav">
  <div class="wrap nav-inner">
    <a href="index.html" class="wordmark" data-wordmark aria-label="Cozy Designs home"></a>
    <a href="index.html" class="back">← Back to home</a>
  </div>
</header>

<!-- HEADER -->
<header class="page-head">
  <div class="wrap">
    <span class="script">Fashion With Purpose</span>
    <h1>Ladies Wear</h1>
    <p>Everyday sets, festive outfits, and custom designs — the full collection, designed and stitched by hand.</p>
    <nav class="cat-jump" id="catJump"></nav>
  </div>
</header>

<!-- GALLERY -->
<section class="section">
  <div class="wrap">
    <div id="ladiesSections"></div>
    <div class="foot-cta">
      <a class="btn" href="index.html#contact">Enquire about a look →</a>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="wrap footer-inner">
    <span class="wordmark" data-wordmark></span>
    <span data-copyright></span>
  </div>
</footer>

<!-- LIGHTBOX (built once, reused for every product) -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Product photos">
  <div class="lb-stage">
    <button class="lb-close" id="lbClose" aria-label="Close">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
    <div class="lb-frame"><img id="lbImg" src="" alt=""></div>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next photo">›</button>
    <div class="lb-title" id="lbTitle"></div>
    <div class="lb-desc" id="lbDesc"></div>
    <div class="lb-price" id="lbPrice"></div>
    <a class="lb-order" id="lbOrder" href="#" target="_blank" rel="noopener">Order now — WhatsApp</a>
    <div class="lb-counter" id="lbCounter"></div>
    <div class="lb-dots" id="lbDots"></div>
  </div>
</div>

<!-- shared product catalog: shop owner edits photos/prices in products.js -->
<script src="products.js"></script>
<script>
const BRAND = "Cozy Designs";

/* ---- wiring (no need to edit) ---- */
const $ = (s)=>document.querySelector(s);
const MONO = (size)=>`
<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <circle cx="25" cy="32" r="17" stroke="#E6B33A" stroke-width="3"/>
  <circle cx="39" cy="32" r="17" stroke="#E6B33A" stroke-width="3"/>
  <line x1="20" y1="44" x2="44" y2="20" stroke="#E6B33A" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="44" cy="20" r="2.4" fill="#E6B33A"/>
</svg>`;
const LOGO = "photos/COZY Logo WIthout BG.svg";
document.querySelectorAll('[data-wordmark]').forEach(el=>{
  el.innerHTML = LOGO
    ? '<img class="logo-img" src="'+LOGO+'" alt="'+BRAND+'"><span class="name">'+BRAND+'</span>'
    : MONO(34) + '<span class="name">'+BRAND+'</span>';
});

const TONES = ["#EDE7D6","#E7E9E2","#E5E8EE","#EFE8DA","#E9E4DA","#E4E8E3"];

/* catalog comes from data/ladies.json, which the shop owner edits at /admin */
const PRODUCTS = [];   // flat list: { name, description, price, images }

async function renderCatalog(){
  await loadSettings();
  const LADIES_WEAR = expandAlsoShowIn(await loadCatalog('data/ladies.json'))
    .filter(cat => cat.slug !== 'new-arrival'); // New Arrivals now lives only on the homepage

  $('#catJump').innerHTML = LADIES_WEAR.map(cat=>'<a href="#'+cat.slug+'">'+cat.category+'</a>').join('');

  $('#ladiesSections').innerHTML = LADIES_WEAR.map(cat=>{
    if(!cat.items || !cat.items.length){
      return '<div class="cat" id="'+cat.slug+'"><div class="cat-head"><p class="eyebrow">Ladies wear</p>'+
             '<h2>'+cat.category+'</h2></div><div class="empty-note">Photos coming soon.</div></div>';
    }
    const tiles = cat.items.map((it,i)=>{
      const imgs = ladiesImgsOf(it);
      const cover = imgs[0] || "";
      const id = PRODUCTS.length;
      PRODUCTS.push({ name: it.name || cat.category, code: it.code || "", description: it.description || "", price: it.price || "", images: imgs });

      const inner = cover
        ? '<img src="'+cover+'" alt="'+(it.name||cat.category)+'">'
        : '<div class="ph" style="background:'+TONES[i%TONES.length]+'"><span class="ph-cap">Add photo</span></div>';

      const badge = imgs.length > 1
        ? '<span class="more-badge">＋'+(imgs.length-1)+' photos</span>'
        : '';

      const cap   = it.name ? '<div class="cap">'+it.name+'</div>' : '';
      const code  = it.code ? '<div class="code">Code: '+it.code+'</div>' : '';
      const desc  = it.description ? '<div class="desc">'+it.description+'</div>' : '';
      const price = it.price ? '<div class="price">'+it.price+'</div>' : '';
      const clickable = imgs.length ? ' data-product="'+id+'" role="button" tabindex="0" aria-label="View photos"' : '';
      const order = '<a class="order-btn" href="'+ladiesWaLink({name:it.name||cat.category,code:it.code,price:it.price})+'" target="_blank" rel="noopener">Order now</a>';

      return '<article class="tile"><div class="tile-img"'+clickable+'>'+inner+badge+'</div>'+cap+code+desc+price+order+'</article>';
    }).join('');
    return '<div class="cat" id="'+cat.slug+'"><div class="cat-head"><p class="eyebrow">Ladies wear</p>'+
           '<h2>'+cat.category+'</h2></div><div class="gallery-grid">'+tiles+'</div></div>';
  }).join('');
}
renderCatalog();

$('[data-copyright]').textContent = '© ' + new Date().getFullYear() + ' ' + BRAND + ' · Kottayam, Kerala';

/* ============================================================
   LIGHTBOX behaviour
   ============================================================ */
const lb       = $('#lightbox');
const lbImg    = $('#lbImg');
const lbTitle  = $('#lbTitle');
const lbDesc   = $('#lbDesc');
const lbPrice  = $('#lbPrice');
const lbOrder  = $('#lbOrder');
const lbCount  = $('#lbCounter');
const lbDots   = $('#lbDots');
const lbPrev   = $('#lbPrev');
const lbNext   = $('#lbNext');
const lbClose  = $('#lbClose');
let current = { images:[], i:0 };

function render(){
  const imgs = current.images, i = current.i;
  lbImg.src = imgs[i];
  lbImg.alt = current.name + ' — photo ' + (i+1);
  lbTitle.textContent = current.code ? current.name+' ('+current.code+')' : current.name;
  lbDesc.textContent  = current.description || '';
  lbDesc.style.display = current.description ? 'block' : 'none';
  lbPrice.textContent = current.price || '';
  lbPrice.style.display = current.price ? 'block' : 'none';
  lbOrder.href = ladiesWaLink({name:current.name, code:current.code, price:current.price});
  const many = imgs.length > 1;
  lbCount.textContent = many ? (i+1) + ' / ' + imgs.length : '';
  lbPrev.disabled = !many;
  lbNext.disabled = !many;
  lbDots.innerHTML = many ? imgs.map((_,d)=>
    '<button class="lb-dot'+(d===i?' active':'')+'" data-dot="'+d+'" aria-label="Photo '+(d+1)+'"></button>'
  ).join('') : '';
}
function openProduct(id){
  const p = PRODUCTS[id];
  if(!p || !p.images.length) return;
  current = { name:p.name, code:p.code, description:p.description, price:p.price, images:p.images, i:0 };
  render();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb(){
  lb.classList.remove('open');
  document.body.style.overflow = '';
}
function step(n){
  const len = current.images.length;
  current.i = (current.i + n + len) % len;
  render();
}

$('#ladiesSections').addEventListener('click', e=>{
  const t = e.target.closest('[data-product]');
  if(t) openProduct(+t.dataset.product);
});
$('#ladiesSections').addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.closest('[data-product]')){
    e.preventDefault();
    openProduct(+e.target.closest('[data-product]').dataset.product);
  }
});

lbPrev.addEventListener('click', ()=>step(-1));
lbNext.addEventListener('click', ()=>step(1));
lbClose.addEventListener('click', closeLb);
lbDots.addEventListener('click', e=>{
  const d = e.target.closest('[data-dot]');
  if(d){ current.i = +d.dataset.dot; render(); }
});
lb.addEventListener('click', e=>{ if(e.target===lb) closeLb(); });
document.addEventListener('keydown', e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft')  step(-1);
  if(e.key==='ArrowRight') step(1);
});

let sx=0;
lb.addEventListener('touchstart', e=>{ sx = e.touches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - sx;
  if(Math.abs(dx) > 45) step(dx < 0 ? 1 : -1);
}, {passive:true});
</script>
</body>
</html>
