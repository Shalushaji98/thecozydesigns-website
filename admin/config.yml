backend:
  name: git-gateway
  branch: main   # change this if your Netlify site deploys from a different branch

# Photos uploaded through the admin panel are saved into /photos in your
# repo (the same folder the site already reads photos from) and served at /photos/...
media_folder: "photos"
public_folder: "/photos"

# Shows a friendly draft/publish workflow instead of publishing every save
# straight away. Set to false if you'd rather changes go live instantly.
publish_mode: editorial_workflow

collections:
  - name: "kids"
    label: "👶 Kids Wear"
    files:
      - name: "kids_catalog"
        label: "Kids Wear Catalog"
        file: "data/kids.json"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{fields.category}}"
            fields:
              - {label: "Category name", name: "category", widget: "string", hint: "Shown as the section heading, e.g. Frocks"}
              - {label: "Slug", name: "slug", widget: "string", hint: "Lowercase, no spaces — used in page links, e.g. frocks"}
              - label: "Products"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Product Code", name: "code", widget: "string", required: false, hint: "e.g. CD-FR-200 — shown on the site and included in the WhatsApp order message"}
                  - {label: "Description", name: "description", widget: "text", required: false}
                  - {label: "Price", name: "price", widget: "string", required: false, hint: "e.g. ₹899"}
                  - label: "Photos"
                    name: "images"
                    widget: "list"
                    summary: "{{fields.image}}"
                    field: {label: "Photo", name: "image", widget: "image"}

  - name: "ladies"
    label: "👗 Ladies Wear"
    files:
      - name: "ladies_catalog"
        label: "Ladies Wear Catalog"
        file: "data/ladies.json"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{fields.category}}"
            fields:
              - {label: "Category name", name: "category", widget: "string", hint: "Shown as the box/section heading, e.g. New Arrival"}
              - {label: "Slug", name: "slug", widget: "string", hint: "Lowercase, no spaces — used in page links, e.g. new-arrival"}
              - label: "Products"
                name: "items"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Product Code", name: "code", widget: "string", required: false, hint: "e.g. CD-FR-200 — shown on the site and included in the WhatsApp order message"}
                  - {label: "Description", name: "description", widget: "text", required: false}
                  - {label: "Price", name: "price", widget: "string", required: false, hint: "e.g. ₹2,499"}
                  - label: "Photos"
                    name: "images"
                    widget: "list"
                    summary: "{{fields.image}}"
                    field: {label: "Photo", name: "image", widget: "image"}
                  - label: "Also list under"
                    name: "also_show_in"
                    widget: "select"
                    required: false
                    hint: "Mainly for New Arrival products — also shows this product in one more box/category, without having to add the photo twice."
                    options:
                      - {label: "— None —", value: ""}
                      - {label: "Everyday Set", value: "everyday-set"}
                      - {label: "Festive Outfit", value: "festive-outfit"}
                      - {label: "Custom Design", value: "custom-design"}

  - name: "settings"
    label: "⚙️ Shop Settings"
    files:
      - name: "shop_settings"
        label: "WhatsApp Number"
        file: "data/settings.json"
        fields:
          - {label: "WhatsApp number", name: "whatsapp", widget: "string", hint: "Country code + number, no + and no spaces, e.g. 919074816251"}
